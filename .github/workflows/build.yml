name: Windows build va testlar

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-2022
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
    steps:
      - uses: actions/checkout@v4

      - name: .NET SDK o'rnatish
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Paketlarni tiklash
        run: dotnet restore AiUstozPro.sln

      - name: Avtomatik testlar (yadro, baza, eksport)
        run: dotnet test tests/AiUstozPro.Tests/AiUstozPro.Tests.csproj -c Release --no-restore --logger "trx;LogFileName=tests.trx" --logger "console;verbosity=normal" --results-directory TestResults

      - name: To'liq yechimni kompilyatsiya qilish (Release)
        if: always()
        run: dotnet build AiUstozPro.sln -c Release --no-restore

      - name: Bitta faylli self-contained nashr (win-x64)
        run: dotnet publish src/AiUstozPro.App/AiUstozPro.App.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o publish

      - name: .exe ni Windows'da ishga tushirib tekshirish (smoke test)
        shell: pwsh
        run: |
          $data = Join-Path $env:RUNNER_TEMP "aup-smoke"
          $p = Start-Process -FilePath "publish\AiUstozPro.exe" -ArgumentList "--smoke-test", "--data-dir", "`"$data`"" -PassThru -Wait
          Write-Host "Chiqish kodi: $($p.ExitCode)"
          $log = Get-Content (Join-Path $data "smoke-test.log") -ErrorAction SilentlyContinue
          $log
          Write-Host "::notice title=Smoke test (.exe)::$(($log | Select-Object -Last 2) -join ' | ')"
          if ($p.ExitCode -ne 0) {
            $err = ($log | Select-Object -Last 12) -join ' | '
            Write-Host "::error title=Smoke test::$err"
            throw "Smoke test muvaffaqiyatsiz"
          }

      - name: Inno Setup o'rnatish (agar yo'q bo'lsa)
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }

      - name: Installer yaratish
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          & $iscc /DAppVersion=0.4.0 /DPublishDir="$PWD\publish" /DOutputDir="$PWD\installer\out" installer\AiUstozPro.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC xatosi" }

      - name: Installerni sinash (o'rnatish -> ishga tushirish -> o'chirish)
        shell: pwsh
        run: |
          $setup = Get-ChildItem installer\out\*.exe | Select-Object -First 1
          $dir = Join-Path $env:RUNNER_TEMP "aup-install"
          $p = Start-Process $setup.FullName -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/DIR=`"$dir`"" -PassThru -Wait
          if ($p.ExitCode -ne 0) { throw "O'rnatish xatosi: $($p.ExitCode)" }
          $data = Join-Path $env:RUNNER_TEMP "aup-install-data"
          $r = Start-Process (Join-Path $dir "AiUstozPro.exe") -ArgumentList "--smoke-test", "--data-dir", "`"$data`"" -PassThru -Wait
          if ($r.ExitCode -ne 0) { throw "O'rnatilgan dastur ishga tushmadi" }
          $u = Get-ChildItem $dir unins*.exe | Select-Object -First 1
          $q = Start-Process $u.FullName -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART" -PassThru -Wait
          Start-Sleep -Seconds 5
          if (Test-Path (Join-Path $dir "AiUstozPro.exe")) { throw "Uninstall fayllarni o'chirmadi" }
          Write-Host "Installer: o'rnatish, ishga tushirish va o'chirish muvaffaqiyatli"

      - name: Yig'ish hisoboti
        if: always()
        shell: pwsh
        run: ./build/make-report.ps1

      - name: Artefaktlar
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AiUstozPro-win-x64
          path: |
            publish/AiUstozPro.exe
            installer/out/*.exe
            BUILD-REPORT.md
            TestResults/*.trx
            docs/*.md
          if-no-files-found: warn

      - name: Reliz (faqat v* teg uchun)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          body_path: BUILD-REPORT.md
          files: |
            publish/AiUstozPro.exe
            installer/out/*.exe
